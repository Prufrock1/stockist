name: Test

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockist
          POSTGRES_PASSWORD: stockist
          POSTGRES_DB: stockist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockist -d stockist"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL: postgres://stockist:stockist@127.0.0.1:5432/stockist
          SESSION_SECRET: ci-session-secret-not-for-production-use
          RETAILER_PASSWORD: maison
          BRAND_PASSWORD: verre
          ALLOW_DEMO_LOGIN: "true"
          ALLOW_RESET: "true"
