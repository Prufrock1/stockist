name: Deploy

# main is production. This runs after Test succeeds on main, and builds the
# image that https://stockist.pro serves.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::487451648436:role/stockistGitHubDeploy
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: 487451648436.dkr.ecr.us-east-1.amazonaws.com/stockist:${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Update the service
        env:
          IMAGE: 487451648436.dkr.ecr.us-east-1.amazonaws.com/stockist:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cat > /tmp/container.json <<EOF
          {
            "image": "$IMAGE",
            "containerPort": 8787,
            "environment": [
              {"name": "NODE_ENV", "value": "production"},
              {"name": "PORT", "value": "8787"},
              {"name": "TRUST_PROXY", "value": "true"}
            ],
            "secrets": [
              {"name": "DATABASE_URL", "valueFrom": "arn:aws:ssm:us-east-1:487451648436:parameter/stockist/database_url"},
              {"name": "SESSION_SECRET", "valueFrom": "arn:aws:ssm:us-east-1:487451648436:parameter/stockist/session_secret"},
              {"name": "RETAILER_PASSWORD", "valueFrom": "arn:aws:ssm:us-east-1:487451648436:parameter/stockist/retailer_password"},
              {"name": "BRAND_PASSWORD", "valueFrom": "arn:aws:ssm:us-east-1:487451648436:parameter/stockist/brand_password"}
            ]
          }
          EOF
          aws ecs update-express-gateway-service \
            --service-arn arn:aws:ecs:us-east-1:487451648436:service/default/stockist \
            --primary-container file:///tmp/container.json \
            --cpu-architecture ARM64
